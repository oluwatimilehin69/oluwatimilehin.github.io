<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — SI Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="siteHeader">
  <div class="wrap">
    <a href="index.html" class="logo"><img src="assets/logo-mark.png" alt="Si Photography" class="logo-icon"> Photography</a>
    <nav class="primary-nav">
      <a href="index.html">Home</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="academy.html" class="active">Academy</a>
      <a href="contact.html">Contact</a>
    </nav>
    <a href="contact.html" class="nav-cta">Book a Session</a>
    <button class="burger" id="burger" aria-label="Open menu"><span></span><span></span><span></span></button>
  </div>
</header>

<section class="auth-section">
  <div class="auth-card checkout-card" id="checkoutCard">
    <p>Loading&hellip;</p>
  </div>
</section>

<footer>
  <div class="wrap">
    <a href="index.html" class="logo"><img src="assets/logo-mark.png" alt="Si Photography" class="logo-icon"> Photography</a>
    <nav>
      <a href="portfolio.html">Portfolio</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="academy.html">Academy</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="foot-social">
      <a href="#">Instagram</a>
      <a href="#">Facebook</a>
      <a href="#">LinkedIn</a>
    </div>
    <div class="copyright">© Si Photography 2026. All rights reserved.</div>
  </div>
</footer>

<script src="main.js"></script>
<script src="academy.js"></script>
<script>
(async () => {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('course');
  const card = document.getElementById('checkoutCard');

  const user = await academyGetMe();
  if (!user) { window.location.href = 'academy-login.html?next=academy-checkout.html%3Fcourse%3D' + slug; return; }

  let course;
  try {
    const courses = await academyFetchCourses();
    course = courses.find(c => c.slug === slug);
  } catch (err) {
    card.innerHTML = `<p>${err.message}</p>`;
    return;
  }
  if (!course) {
    card.innerHTML = `<h1>Course not found</h1><p style="color:var(--text-2);margin-top:10px;">Head back to <a href="academy.html" style="color:var(--accent);">the Academy</a> and pick a course.</p>`;
    return;
  }
  if (user.enrollments[slug] && user.enrollments[slug].paid) {
    window.location.href = 'academy-course.html?course=' + slug;
    return;
  }

  card.innerHTML = `
    <div class="kicker">Checkout</div>
    <h1>${course.title}</h1>
    <div class="order-summary">
      <span class="name">${course.duration} &middot; ${course.modules.length} modules</span>
      <span class="amount">${academyFormatNaira(course.price)}</span>
    </div>
    <div class="auth-error" id="checkoutError"></div>
    <button class="btn-primary auth-submit" id="payBtn">Pay with Paystack</button>
    <div class="demo-note">You'll be redirected to Paystack's secure checkout to complete payment.</div>`;

  document.getElementById('payBtn').addEventListener('click', async () => {
    const btn = document.getElementById('payBtn');
    const errorBox = document.getElementById('checkoutError');
    btn.textContent = 'Redirecting…';
    btn.disabled = true;
    const result = await academyStartCheckout(slug);
    if (!result.ok) {
      errorBox.textContent = result.error;
      errorBox.classList.add('show');
      btn.textContent = 'Pay with Paystack';
      btn.disabled = false;
    }
    // on success, academyStartCheckout already redirected the browser
  });
})();
</script>
</body>
</html>
